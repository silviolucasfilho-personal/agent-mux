# The loop patterns agent-mux schedules. Every field deserializes into
# `crate::loops::Pattern`. Skills are listed triage first; the scaffolder
# installs each one from `loops/skills/<name>/SKILL.md`. Priority is the
# scheduler order when several loops are due: the loops that unblock the
# others run first.

[[patterns]]
id = "ci-sweeper"
name = "CI Sweeper"
goal = "Keep the default branch green: find failing checks, tell flaky from real, and propose one fix per run."
default_interval_s = 900
week_one_level = "L2"
state_file = "ci-sweeper-state.md"
skills = ["loop-ci-triage", "loop-fix", "loop-rules"]
verifier = true
breaker = true
human_gates = ["infra-failures", "max-attempts", "security-tests"]
risk = "medium"
token_cost = "very-high"
max_runs_per_day = 96
max_tokens_per_day = 1000000
priority = 1

[patterns.cost]
tokens_noop = 5000
tokens_report = 50000
tokens_action = 200000
stable_fraction = 0.35
early_exit_required = true

[[patterns]]
id = "pr-babysitter"
name = "PR Babysitter"
goal = "Watch open pull requests for conflicts, red or missing checks and stalled reviews, and nudge or fix the smallest thing that unblocks them."
