# Bundled model price table. USD per 1M tokens. Data, not code: verify every
# row against the provider's pricing page when editing, and bump
# `updated_at`. Users override or add rows with `[[tracing.models]]` in
# profiles.toml; rows edited directly in the DB (`source = 'user'`) are never
# touched by this file.
#
# `match` entries are lowercase; a trailing `*` is a prefix match. Model
# names are normalized before matching (provider prefixes, `[1m]`, Bedrock
# and date suffixes stripped), so `claude-sonnet-4-5-20250929` matches
# `claude-sonnet-4-5`.
#
# Source: LiteLLM `model_prices_and_context_window.json` (the table ccusage
# prices from), fetched 2026-10-04 and converted per-token → per-million;
# `cache_read` = `cache_read_input_token_cost`, `cache_write` =
# `cache_creation_input_token_cost`, `cache_write_1h` = the `above_1hr`
# rate, `reasoning` only where it differs from `output`. Rows LiteLLM does
# not carry under a bare name are kept from the previous table and say so.
# Regenerate with the script in docs/superpowers/specs/2026-10-04-tracing-review-and-ux-design.md
# section 7, or by hand from the same file.
updated_at = "2026-10-04"

[[models]]
id = "claude-fable-5-1"
provider = "anthropic"
match = ["claude-fable-5-1", "claude-mythos-5-1", "claude-fable-5-1-*", "claude-mythos-5-1-*"]
input = 10.0
output = 50.0
cache_read = 0.25
cache_write = 12.5
cache_write_1h = 20.0

