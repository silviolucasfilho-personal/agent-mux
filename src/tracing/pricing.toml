# Bundled model price table. USD per 1M tokens. Data, not code: verify every
# row against the provider's pricing page when editing, and bump
# `updated_at`. Users override or add rows with `[[tracing.models]]` in
# profiles.toml; rows edited directly in the DB (`source = 'user'`) are never
# touched by this file.
#
# `match` entries are lowercase; a trailing `*` is a prefix match. Model
# names are normalized before matching (provider prefixes, `[1m]`, Bedrock
# and date suffixes stripped), so `claude-sonnet-4-5-20250929` matches
# `claude-sonnet-4-5`.
#
# Sources: Anthropic API reference snapshot (2026-06) for the Claude rows;
# Langfuse `default-model-prices.json` (v4.24.0) for cross-checks and the
# Codex/GPT rows. Cache write 5m = 1.25× input, 1h = 2× input, cache read =
# 0.1× input for Claude unless the provider states otherwise.
updated_at = "2026-06-24"

[[models]]
id = "claude-fable-5-1"
provider = "anthropic"
match = ["claude-fable-5-1", "claude-mythos-5-1"]
input = 10.0
output = 50.0
cache_read = 0.25
cache_write = 12.5
cache_write_1h = 20.0

