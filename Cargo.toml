[package]
name = "agent-mux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.4"
tui-term = "0.3.4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.26.0", features = ["v4", "v5"] }
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.27.0"
