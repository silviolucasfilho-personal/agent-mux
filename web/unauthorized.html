<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>agent-mux</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main id="term-host">
  <form method="GET" action="/" class="sheet-card token-form">
    <p class="hint title">agent-mux remote control</p>
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <p class="hint">The desktop prints the full URL when it starts, and <b>v</b> shows it again.</p>
    <div class="sheet-actions bare">
      <button class="btn primary" type="submit">Connect</button>
    </div>
  </form>
</main>
</body>
</html>
