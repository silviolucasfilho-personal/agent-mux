# Grimoire's Oracle review as a workflow: the Sage writes a brief of the
# change, the Paladin, the Cleric and the Ranger each review it through
# their own lens, every finding meets three independent refuters, and the
# Oracle's verdict (APPROVED, NEEDS_CHANGES or NEEDS_HUMAN) closes the run.
#
# Nothing is published: the report is the run's result. Posting review
# comments on a pull request stays with a human. `accept` sends every
# verdict other than APPROVED to the inbox (`I`); the run's headline in
# the Workflows view and `workflow status` reads the verdict line.
#
# A scope that cannot be read (a mistyped ref, no `gh`, a pull request
# that is not checked out, an empty diff) never ends in APPROVED: the
# brief says so on its first line and the verdict turns it into
# NEEDS_HUMAN.
[workflow]
name = "grimoire-review"
description = "A merge-gate review in the style of Grimoire: a brief of the change, three reviewers (security; bugs and edge cases; simplification and design), three refuters per finding, and a verdict: APPROVED, NEEDS_CHANGES or NEEDS_HUMAN."
when_to_use = "Before a merge, when you want a verdict to act on. For a list of defects use review-changes; for findings that must survive two checkers, santa-review."
output = "verdict"
accept = ["APPROVED"]

[args.scope]
description = "What to review: a git ref range (develop..HEAD), a pull request as #123 (check it out first: gh pr checkout 123), a path, or empty for the uncommitted working tree including untracked files."
default = ""

[args.language]
description = "The language the verdict is written in."
default = "English"

[schemas.findings]
fields.findings = { type = "array", items = "finding", required = true }
[schemas.finding]
fields.file = { type = "string", required = true }
fields.line = { type = "integer" }
fields.title = { type = "string", required = true }
fields.why = { type = "string", required = true, description = "The concrete failure (inputs, state, wrong output) or, for the Ranger, the cost and the evidence for it." }
fields.severity = { type = "string", enum = ["critical", "high", "medium", "low"], required = true }
fields.category = { type = "string", enum = ["security", "bug", "edge-case", "simplification", "performance", "architecture"], required = true }
fields.lens = { type = "string", enum = ["paladin", "cleric", "ranger"], required = true }
fields.fix = { type = "string", required = true, description = "The exact change that resolves it." }
[schemas.verdict]
fields.refuted = { type = "boolean", required = true }
fields.reason = { type = "string", required = true }

[[steps]]
id = "brief"
kind = "single"
phase = "Brief"
skill = "wf-grimoire-brief"
args = { scope = "{args.scope}" }

[[steps]]
id = "find"
kind = "fanout"
phase = "Review"
over = ["paladin", "cleric", "ranger"]
skill = "wf-grimoire-lens"
input = "brief"
args = { lens = "{item}", scope = "{args.scope}" }
result = "findings"

# Low findings are dropped before the votes, so no refuter is spent on
# them; a design question (`architecture`) always goes on to the verdict.
[[steps]]
id = "confirmed"
kind = "pipeline"
phase = "Verify"
over = "find[*].findings[*]"
dedupe_by = ["file", "line", "category"]
keep = "severity in [critical, high, medium] or category == 'architecture'"
verify = { skill = "wf-refute", votes = 3, result = "verdict", keep = "refuted < 2" }

[[steps]]
id = "verdict"
kind = "single"
phase = "Verdict"
skill = "wf-grimoire-verdict"
input = "confirmed"
args = { scope = "{args.scope}", language = "{args.language}", brief = "{brief}", reviews = "{find}" }
