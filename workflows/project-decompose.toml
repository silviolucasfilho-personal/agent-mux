# A step of the Projects flow (docs/project.md): one read-only session.
# The session writes no file and creates no issue: its answer is checked by
# agent-mux, which renders the draft as decomposition.md and publishes it
# for a person to review.
[workflow]
name = "project-decompose"
description = "Draft the decomposition of a Feature into ordered Stories, each with its Tasks."
when_to_use = "Started by `agent-mux project run` for a Feature whose spec and plan are approved and that has no decomposition.md."
output = "work"
default_isolation = "none"

[args.kind]
description = "What is decomposed: feature or rfc."
required = true
[args.issue]
description = "The issue: number, title and body."
required = true
[args.spec]
description = "The Feature's spec.md, from the default branch."
default = ""
[args.plan]
description = "The Feature's plan.md, from the default branch."
default = ""
[args.repos]
description = "The slugs of the Project's code repositories."
default = ""
[args.workspace]
description = "The code repositories of the Project and their folders, when the hub holds only documents."
default = ""

[schemas.task]
fields.title = { type = "string", required = true }
fields.body = { type = "string", required = true }
[schemas.story]
fields.title = { type = "string", required = true }
fields.userStory = { type = "string" }
fields.body = { type = "string" }
fields.dependsOn = { type = "array", items = "integer" }
fields.repos = { type = "array", items = "string" }
fields.tasks = { type = "array", items = "task", required = true }
[schemas.stories]
fields.stories = { type = "array", items = "story", required = true }

[[steps]]
id = "work"
phase = "Work"
agent = "tech-lead"
skill = "wf-project-decompose"
isolation = "none"
args = { kind = "{args.kind}", issue = "{args.issue}", spec = "{args.spec}", plan = "{args.plan}", repos = "{args.repos}", workspace = "{args.workspace}" }
result = "stories"
