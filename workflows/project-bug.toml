# A step of the Projects flow (docs/project.md): one read-only session.
# The session writes no file: its answer is checked by agent-mux, which
# commits a document and opens its pull request, or records the findings.
[workflow]
name = "project-bug"
description = "Write the bug.md of a defect from the report in its issue."
when_to_use = "Started by `agent-mux project run` for a Bug with no bug.md."
output = "work"
default_isolation = "none"

[args.issue]
description = "The Bug's issue: title, labels, the required sections and the report with its comments, as JSON."
required = true
[args.workspace]
description = "The code repositories of the Project and their folders, when the hub holds only documents."
default = ""

[schemas.document]
fields.document = { type = "string", required = true }

[[steps]]
id = "work"
phase = "Work"
agent = "tech-lead"
skill = "wf-project-bug"
isolation = "none"
args = { issue = "{args.issue}", workspace = "{args.workspace}" }
result = "document"
