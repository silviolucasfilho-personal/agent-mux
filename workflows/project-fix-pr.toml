# The fix-pr step of the Projects flow (docs/project.md): what a person's
# review of a pull request asked for, fixed on the pull request's branch
# and reviewed. agent-mux, not a session, pushes the fixes, answers each
# comment with its commit and leaves the summary.
[workflow]
name = "project-fix-pr"
description = "Fix what the review of a pull request asked for: one commit per comment in a worktree on its branch, with an independent review."
when_to_use = "Started by `agent-mux project run <n> --step fix-pr` for a Story or Bug whose pull request has open review comments. The run forks from the pull request's branch."
output = "build"
default_isolation = "worktree"

[args.kind]
description = "What is done: fix-pr."
default = "fix-pr"
[args.context]
description = "The review comments to resolve, each with its key, and the work item."
required = true
[args.criteria]
description = "One criterion per review comment, one per line."
required = true
[args.setup]
description = "A command the implementer runs once in its worktree before it starts."
default = ""

[schemas.file_change]
fields.path = { type = "string", required = true }
fields.change = { type = "string", required = true }
[schemas.check]
fields.command = { type = "string", required = true }
fields.result = { type = "string", required = true }
[schemas.fix]
fields.comment = { type = "string", required = true }
fields.commit = { type = "string", required = true }
fields.note = { type = "string", required = true }
[schemas.declined]
fields.comment = { type = "string", required = true }
fields.reason = { type = "string", required = true }
[schemas.implementation]
fields.base = { type = "string", required = true }
fields.fixes = { type = "array", items = "fix", required = true }
fields.declined = { type = "array", items = "declined", required = true }
fields.change_summary = { type = "array", items = "file_change", required = true }
fields.verification = { type = "array", items = "check", required = true }
fields.deviations = { type = "array", items = "string", required = true }
fields.known_limitations = { type = "array", items = "string", required = true }

[schemas.criterion]
fields.criterion = { type = "string", required = true }
fields.pass = { type = "boolean", required = true }
fields.evidence = { type = "string", required = true }
[schemas.review]
fields.verdict = { type = "string", enum = ["approve", "request_changes", "reject"], required = true }
fields.criteria_results = { type = "array", items = "criterion", required = true }
fields.blocking_findings = { type = "array", items = "string", required = true }
fields.suggestions = { type = "array", items = "string", required = true }
fields.summary = { type = "string", required = true }

# The implementer works in a worktree on the pull request's branch and
# commits; the reviewer reads the new commits there, on another harness
# when there is one. Sent back at most max_cycles times.
[[steps]]
id = "build"
kind = "revise"
phase = "Build"
agent = "implementer"
skill = "wf-project-build"
args = { kind = "{args.kind}", context = "{args.context}", criteria = "{args.criteria}", setup = "{args.setup}" }
result = "implementation"
review = { agent = "reviewer", skill = "wf-project-review", harness = "other", result = "review", pass = "verdict == \"approve\"", stop = "verdict == \"reject\"" }
max_cycles = 2
