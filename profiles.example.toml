# Copy to profiles.toml (same directory as the exe, or ~/.agent-mux/profiles.toml)
#
# Note: a cwd-relative ./profiles.toml wins the search even when it contains
# only a [tracing] section — the built-in default profiles are used and any
# ~/.agent-mux/profiles.toml is shadowed. If you customize profiles, keep
# [tracing] in the same file as them.

# Local session tracing. ON by default: every session is recorded into a
# SQLite file (default ~/.agent-mux/traces.db, or $AGENT_MUX_TRACE_DB) that
# nothing but this machine ever sees — no keys, no network. Browse it with
# `agent-mux trace ls | show | search`, the [T] trace browser, or any SQLite
# tool. Run `agent-mux trace doctor` to check the store and price table.
#
# content_mode = "full" (default) stores prompts, responses, thinking, and
# tool I/O, passed through built-in secret-pattern masking (sk-, pk-lf-,
# AKIA, ghp_, xox, Bearer, -----BEGIN blocks) plus your redact_literals and
# size truncation. The store sits next to the CLIs' own transcripts, which
# already hold the same text in plaintext; the file is created 0600.
# content_mode = "metadata" stores NO prompt/response/tool bodies — only
# names, timings, models, token usage, cost, and error levels.
#
# Token usage comes from each CLI's own records: Claude and Codex write it
# into their transcripts; Antigravity keeps it in
# <antigravity_dir>/conversations/<id>.db, which agent-mux reads alongside
# the transcript. Cost needs a price row for the model (`agent-mux trace
# doctor` lists unpriced ones; Gemini rows are not bundled).
#
# The old `[langfuse]` section is accepted as an alias for one release;
# its host/keys are used as [tracing.langfuse] credentials. Rename it to
# `[tracing]`.
#
# [tracing]
# enabled = true
# db_path = "~/.agent-mux/traces.db"
# content_mode = "full"
# backend = "local"           # where a launch's traces go: "local" (SQLite, default), "langfuse",
#                             # or "both". The launch dialog's Backend field overrides it per session;
#                             # Langfuse is offered only when [tracing.langfuse] (or $LANGFUSE_*) resolves.
# hooks = "auto"              # "auto" (default): every claude launch gets the trace hooks through an
#                             # inline --settings and every codex launch a per-launch notify override;
#                             # nothing in ~/.claude or ~/.codex is modified. "off": no per-launch
#                             # registration and hook rows are ignored. "installed": same as auto
#                             # (the opt-in installers, `agent-mux trace hooks install codex|agy`,
#                             # work in either mode).
# user_id = "me"                        # default: $USER / $USERNAME
# release = "rollout-1"                 # free-form labels stored on every launch
# tags = ["agent-mux"]
# environment = "development"
# content_max_bytes = 65536             # per-field truncation cap (full mode)
# redact_literals = []                  # extra literal substrings masked in full mode
# backfill_max_bytes = 4194304          # prime-pass cap for huge resumed transcripts
# poll_interval_ms = 500
# flush_interval_ms = 250               # batch commit cadence
# shutdown_flush_ms = 1000              # 0 = never wait for the flush at quit
# retention_days = 0                    # 0 = keep forever; otherwise pruned at startup
# claude_dir = "/custom/.claude"        # dir overrides (mostly for tests)
# codex_dir = "/custom/.codex"
# antigravity_dir = "/custom/.gemini/antigravity-cli"   # the antigravity-cli ROOT (brain/ and presence/ live under it)
#
# Langfuse credentials, for backend = "langfuse" | "both". Keys fall back to
# $LANGFUSE_PUBLIC_KEY / $LANGFUSE_SECRET_KEY / $LANGFUSE_HOST; prefer the
# environment for secret_key — this file is easy to commit by accident.
# [tracing.langfuse]
# host = "https://cloud.langfuse.com"   # or https://us.cloud.langfuse.com / self-hosted
# public_key = "pk-lf-..."
# secret_key = "sk-lf-..."
# flush_interval_ms = 3000
#
# Price overrides / additions, USD per 1M tokens. `match` entries are
# lowercase; a trailing '*' is a prefix match; model names are normalized
# before matching (provider prefixes, [1m], date suffixes stripped). A row
# with an existing id replaces the bundled one. Run `agent-mux trace recost`
# after changing prices.
# [[tracing.models]]
# id = "claude-sonnet-5"
# match = ["claude-sonnet-5", "claude-sonnet-5-*"]
# input = 2.0
# output = 10.0
# cache_read = 0.20
# cache_write = 2.50            # 5-minute cache writes
# cache_write_1h = 4.00         # 1-hour cache writes
# reasoning = 14.0              # optional; otherwise reasoning tokens bill as output

# Launch defaults per profile. Both are optional: an unset key passes no
# flag at all, so each CLI keeps its own default. The new-session dialog
# pre-fills from these and can override them for a single launch, and it
# also offers resume and a one-shot prompt, which are per-launch only.
#
#   model            --model <id>      (claude, codex, agy)
#   bypass_approvals --dangerously-skip-permissions (claude, agy), --yolo (codex)

[[profiles]]
name = "Claude Code"
command = "claude"
args = []
# default_dir = "~/workspace" # or "/home/user/workspace" on Linux/macOS, "C:\\Users\\me\\workspace" on Windows

# Per-profile tracing overrides (all optional):
# [profiles.tracing]
# enabled = true
# provider = "claude"          # force CLI-kind detection for wrapper commands; "none" = never trace
# content_mode = "metadata"    # dial one profile down
# hooks = "off"               # no per-launch hook registration for this profile only
# backend = "langfuse"        # this profile's default destination (the dialog can still change it)
# inject_session_id = false    # never add --session-id. The flag needs claude >= 1.0.34 (mid-2025);
#                              # `agent-mux trace doctor` checks your installed version.

[[profiles]]
name = "Codex"
command = "codex"
args = []

[[profiles]]
name = "Antigravity"
command = "agy"
args = []
